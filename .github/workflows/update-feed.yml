
name: Update eMAG and Skroutz Feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Generate existing marketplace feeds
        run: |
          python generate_feed_v2.py

      - name: Generate Skroutz feed
        run: |
          python generate_skroutz_feed.py

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add *.xml *.csv
          git commit -m "Auto update marketplace feeds" || echo "No changes"
          git push
